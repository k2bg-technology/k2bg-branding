name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build test-utils package
        run: pnpm --filter=test-utils build

      - name: Run tests
        run: pnpm test

  test-db:
    name: DB Integration Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build test-utils package
        run: pnpm --filter=test-utils build

      - name: Run DB integration tests
        run: pnpm -F blog test:db

  lint:
    name: Lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linting
        run: pnpm lint

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

  # Advisory until the pre-existing violations tracked in #372 are fixed; then remove continue-on-error to make it a required gate.
  storybook-a11y:
    name: Storybook A11y
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium

      - name: Build Storybook
        run: pnpm -F ui build-storybook

      # Advisory until the pre-existing violations tracked in #372 are cleared:
      # the step records its failure as a warning instead of failing the job.
      - name: Run Storybook accessibility tests
        id: storybook-a11y
        continue-on-error: true
        run: >
          pnpm exec concurrently -k -s first -n server,tests
          "pnpm exec http-server packages/ui/storybook-static -p 6006 -a 127.0.0.1 --silent"
          "until curl -s http://127.0.0.1:6006 >/dev/null; do sleep 1; done; pnpm -F ui test:storybook --url http://127.0.0.1:6006"

      - name: Report accessibility violations as a warning
        if: steps.storybook-a11y.outcome == 'failure'
        run: |
          echo "::warning title=Storybook A11y::axe reported accessibility violations (advisory, tracked in #372); see the 'Run Storybook accessibility tests' step log."

  docs-check:
    name: Agent Docs Check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run docs checker tests
        run: node --test scripts/check-docs.test.mjs

      - name: Verify agent documentation references
        run: node scripts/check-docs.mjs

  icon-map:
    name: Icon Map Sync
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Regenerate icon map
        run: node packages/ui/src/components/Icon/generateIconUrls.mjs

      - name: Verify icon map is committed and up to date
        run: |
          if ! git diff --exit-code packages/ui/src/components/Icon/iconUrls.generated.ts; then
            echo "::error::iconUrls.generated.ts is out of date. Run 'pnpm -F ui generate:icons' and commit the result."
            exit 1
          fi
