name: Release Content Schema

on:
  push:
    tags: ['content-schema@*']

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify tag version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(node -p "require('./packages/content-schema/package.json').version")
          if [ "${TAG#content-schema@}" != "$version" ]; then
            echo "::error::Tag version does not match packages/content-schema/package.json"
            exit 1
          fi

      - name: Test content schema
        run: pnpm -F content-schema test

      - name: Build content schema
        run: pnpm -F content-schema build

      - name: Pack content schema
        run: pnpm -F content-schema pack --pack-destination "$RUNNER_TEMP/pack"

      - name: Verify tarball contents
        run: |
          for tarball in "$RUNNER_TEMP"/pack/*.tgz; do
            tar -tzf "$tarball" > "$RUNNER_TEMP/tarball-entries.txt"
            while IFS= read -r entry; do
              case "$entry" in
                package/package.json|package/README.md|package/dist/*) ;;
                *)
                  echo "::error::Unexpected tarball entry: $entry"
                  exit 1
                  ;;
              esac
            done < "$RUNNER_TEMP/tarball-entries.txt"
          done

      - name: Upload tarball
        uses: actions/upload-artifact@v7
        with:
          name: content-schema-tarball
          path: ${{ runner.temp }}/pack/*.tgz
          if-no-files-found: error
          retention-days: 1

  # Holds the only write token and runs only GitHub-owned actions: no checkout, no dependency install.
  release:
    name: Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download tarball
        uses: actions/download-artifact@v8
        with:
          name: content-schema-tarball
          path: pack

      - name: Create GitHub Release
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$TAG" pack/*.tgz \
            --verify-tag \
            --title "$TAG" \
            --notes "Content bundle schemas and validation for a client. See the packaged README for the contract and usage."
