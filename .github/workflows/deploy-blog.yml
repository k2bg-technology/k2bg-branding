name: Deploy Blog

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write

concurrency:
  group: blog-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AMPLIFY_APP_ID: dvq9wo4ad1519
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-1

      # RELEASE builds the latest commit on the branch, so no checkout is needed.
      - name: Start Amplify release and wait for the result
        run: |
          JOB_ID=$(aws amplify start-job --app-id "$AMPLIFY_APP_ID" --branch-name main \
            --job-type RELEASE --query 'jobSummary.jobId' --output text)
          echo "Started Amplify job $JOB_ID"
          while :; do
            STATUS=$(aws amplify get-job --app-id "$AMPLIFY_APP_ID" --branch-name main \
              --job-id "$JOB_ID" --query 'job.summary.status' --output text)
            echo "Status: $STATUS"
            case "$STATUS" in
              SUCCEED) exit 0 ;;
              FAILED|CANCELLED) exit 1 ;;
              *) sleep 20 ;;
            esac
          done
