version: 1
applications:
  - frontend:
      phases:
        preBuild:
          commands:
            - npm install -g pnpm && pnpm install
        build:
          commands:
            - env > apps/blog/.env && pnpm build --filter=blog
      artifacts:
        baseDirectory: apps/blog/.next
        files:
          - "**/*"
      cache:
        paths:
          - .next/cache/**/*
          - node_modules/**/*
      buildPath: /
    appRoot: apps/blog
